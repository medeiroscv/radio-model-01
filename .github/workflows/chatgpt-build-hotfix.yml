name: Build RadioCMS hotfix

on:
  push:
    branches:
      - chatgpt/fix-installer-updater

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-installer-updater
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Commit compiled assets
        run: |
          if git diff --quiet -- public/build; then
            echo "public/build already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/build
          git commit -m "build: compile updater hotfix assets"
          git push origin HEAD:chatgpt/fix-installer-updater
