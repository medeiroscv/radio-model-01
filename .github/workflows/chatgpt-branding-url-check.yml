name: Check branding public URL

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -l app/Support/BrandingAsset.php
          php -l app/Http/Middleware/HandleInertiaRequests.php
          php -l app/Http/Controllers/Admin/StationController.php
